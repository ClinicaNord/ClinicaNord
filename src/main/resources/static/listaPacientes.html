<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Pacientes</title>
    <link rel="stylesheet" href="./style/listaPacientes.css">
    <link rel="stylesheet" href="./style/todos.css">
    <script src="./script/listaPaciente.js"></script>
    <script src="./script/todos.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <img src="./img/logo.png" alt="Logo">
            <span>Clínica Nord</span>
        </div>
        <nav>
            <a href="./index.html"><button>Início</button></a>
            <a href="./sobrenos.html"><button>Sobre nós</button></a>
        </nav>
    </header>

    <!-- Main Container -->
    <div class="container">
        <h1>Lista de Pacientes</h1>

        <!-- Busca -->
        <input type="text" id="nomePaciente" placeholder="Digite o nome do paciente">

        <!-- Tabela de Pacientes -->
        <table id="tabelaPacientes">
            <thead>
                <tr>
                    <th>Nome do Paciente</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Tabela de Agendamentos -->
        <div id="agendamentos" style="display:none;">
            <h2>Agendamentos de <span id="nomePacienteSelecionado"></span></h2>
            <table id="tabelaAgendamentos">
                <thead>
                    <tr>
                        <th>Data e Hora</th>
                        <th>Serviço</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>Feito por:</p>

        <a href="https://github.com/dias-crypto"><i class="fa fa-github"></i> Natália Dias</a>
        <a href="https://github.com/TuannyThomazelli"><i class="fa fa-github"></i> Tuanny Thomazelli</a>
    </footer>
