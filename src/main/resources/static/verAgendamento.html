<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clínica Nord</title>
  <link rel="stylesheet" href="./style/verAgendamento.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">
      <img src="./img/logo.png" alt="Logo" class="logo-img">
      <h1>Clínica Nord</h1>
    </div>
    <nav>
      <button>Início</button>
      <button>Sobre nós</button>
    </nav>
  </header>

  <!-- Card central -->
  <main class="card">
    <div class="profile">
      <img src="img/perfilbrenda (2).png" alt="Brenda" class="profile-img">
      <h2>Brenda Mendes</h2>
      <ul>
        <li>Fonoterapia</li>
        <li>Segunda 1/8</li>
        <li>15:00</li>
        <li>Cristiane Mattos</li>
      </ul>
    </div>
    <div class="buttons">
      <button class="cancel">Cancelar agendamento</button>
      <button class="edit">Editar agendamento</button>
      <button class="new">Agendar um novo atendimento</button>
    </div>
  </main>

  <!-- Rodapé -->
  <footer>
    <p>Feito por 
      <a href="#">Gustavo Leme</a>,
      <a href="#">Isabele Agapito</a>,
      <a href="#">Júlia França</a>,
      <a href="#">Natália Dias</a>,
      <a href="#">Tuanny Thomazelli</a>
    </p>
  </footer>
</body>
</html>
