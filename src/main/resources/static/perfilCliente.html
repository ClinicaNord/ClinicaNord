<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Usuário</title>
    <link rel="stylesheet" href="./style/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <script src="./script/perfil.js"></script>
</head>
<body>
  <header>
    <div class="logo">
      <img src="./img/logo.png" alt="Logo">
      <span>Clínica Nord</span>
    </div>
    <nav>
      <a href="./index.html"><button>Inicio</button></a>
      <a href="./sobreNos.html"><button>Sobre nós</button></a>
    </nav>
  </header>

  <div class="perfil-container">
    <h2>Perfil do usuário</h2>
    <img src="./img/logo.png" alt="Foto de Perfil" class="foto-perfil">
        
    <div class="info">
      <div>
			<strong>Nome:</strong> <span id="nome"></span>  <!-- exibe nome do usuário -->
		</div>
		<div>
			<strong>Email:</strong> <span id="email"></span>  <!-- exibe email do usuário -->
		</div>
    <div>
      <strong>Telefone:</strong> <span id="telefone"></span>  <!-- exibe telefone do usuário -->
      <div>
      <strong>Data de Nascimento:</strong> <span id="dataNascimento"></span>  <!-- exibe data de nascimento do usuário -->
      </div>
    </div>

    <button onclick="verAgendamentos()">Ver meus agendamentos</button>
  </div> 
  <div class="espaco"></div>
  <div class="footer">
    <span>Feito por</span>
    <i class="fa fa-github"></i><a href="https://github.com/Gusleme">Gustavo Leme</a>
    <i class="fa fa-github"></i><a href="https://github.com/Isaagapito">Isabele Agapito</a>
    <i class="fa fa-github"></i><a href="https://github.com/jucastrox">Júlia França</a>
    <i class="fa fa-github"></i><a href="https://github.com/dias-crypto">Natália Dias</a>
    <i class="fa fa-github"></i><a href="https://github.com/TuannyThomazelli">Tuanny Thomazelli</a>
  </div>

</body>
</html>
