<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="./style/login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<script src="./script/login.js"></script>
</head>
<body>
<!-- Cabeçalho -->
    <header>
    <img src="./img/logo.png" alt="Logo"> 
    <span>Clinica Nord</span>
    <h1>Login</h1>
    <a href="./index.html"><button class="btn-inicio">Início</button></a>
    </header>

<!-- Formulário de Login -->
<form id="loginForm">
    <div class="login-container">
    <div class="login-box">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Digite seu email" required>
    <label for="senha">Senha:</label>
    <input type="password" id="senha" placeholder="Digite sua senha" required>

    <button type="button" class="btn-submit" onclick="location.href='./cadastroCliente.html'">Não tenho cadastro</button>
    <button type="submit" class="btn-submit" >Continuar</button>
    </div>
    </div>
</form>
<!-- Rodapé -->
<footer>
    <p>Feito por:</p>
    <div></div>
    <div class="devs">
    <a href="https://github.com/Gusleme"><i class="fa fa-github"></i> Gustavo Leme</a>
    <a href="https://github.com/Isagapito"><i class="fa fa-github"></i> Isabele Agapito</a>
    <a href="https://github.com/jucastrox"><i class="fa fa-github"></i> Júlia França</a>
    <a href="https://github.com/dias-crypto"><i class="fa fa-github"></i> Natália Dias</a>
    <a href="https://github.com/TuannyThomazelli"><i class="fa fa-github"></i> Tuanny Thomazelli</a>
    </div>
    </footer>
</body>
<script src="./script/login.js"></script>
</html>
