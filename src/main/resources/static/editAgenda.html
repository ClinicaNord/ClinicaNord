<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style/editAgenda.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <title>Calendário da Clínica</title>
</head>
<header>
  <div class="logo">
    <img src="./img/logo.png" alt="Logo">
    <span>Clínica Nord</span>
  </div>
  <nav>
    <a href="./perfilAdm.html"><button class="btn-inicio">Perfil</button></a>
    <a href="./listaPacientes.html"><button class="btn-inicio">Lista de Pacientes</button></a>
  </nav>
</header>
<body>
  <div class="calendar-container">
  <h2>Calendário da Clínica (Seg a Sáb)</h2>

  <!-- Cabeçalho dos dias da semana -->
  <div id="calendar-header" style="display: grid; grid-template-columns: repeat(6, 1fr); max-width: 700px; margin: 0 auto 10px auto; gap: 5px;">
    <div class="day-name">Seg</div>
    <div class="day-name">Ter</div>
    <div class="day-name">Qua</div>
    <div class="day-name">Qui</div>
    <div class="day-name">Sex</div>
    <div class="day-name">Sáb</div>
  </div>

  <!-- Calendário -->
  <div id="calendar"></div>

  <!-- Agenda -->
  <div id="schedule" class="schedule">
    <h3 id="selected-day"></h3>
    <button id="toggle-day-btn">Bloquear dia inteiro</button>
    <div id="time-slots"></div>
  </div>
  </div>

  <footer> 
    <p>Feito por:</p>
    <div></div>
    <a href="https://github.com/Gusleme"><i class="fa fa-github"></i> Gustavo Leme</a>
    <a href="https://github.com/Isaagapito"><i class="fa fa-github"></i> Isabele Agapito</a>
    <a href="https://github.com/jucastrox"><i class="fa fa-github"></i> Júlia França</a>
    <a href="https://github.com/dias-crypto"><i class="fa fa-github"></i> Natália Dias</a>
    <a href="https://github.com/TuannyThomazelli"><i class="fa fa-github"></i> Tuanny Thomazelli</a>
  </footer>
  <script src="./script/editAgenda.js"></script>
</body>
</html>
