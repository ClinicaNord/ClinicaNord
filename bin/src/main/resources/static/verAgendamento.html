<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clínica Nord</title>
  <link rel="stylesheet" href="./style/verAgendamento.css">
  <link rel="stylesheet" href="./style/todos.css">
  <script src="./script/todos.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">
      <img src="./img/logo.png" alt="Logo" class="logo-img">
      <h1>Clínica Nord</h1>
    </div>
    <nav>
      <a href="./sobreNos.html"><button>Sobre nós</button></a>
      <a href="./login.html"><button>Login</button></a>
    </nav>
  </header>

  <!-- Card central -->
  <main class="card">
    <div class="profile">
      <img src="./img/logo.png" alt="Brenda" class="profile-img">
      <ul>
        <div>
          <strong>Nome: </strong><span id="nome"></span>
        </div>
        <div>
          <strong>Serviço: </strong><span id="servico"></span>
        </div>
        <div>
            <strong>Data: </strong><span id="data"></span>
        </div>
        <div> 
            <strong>Hora: </strong><span id="hora"></span>
        </div>
        <div>
            <strong>Profissional: </strong><span id="profissional"></span>
        </div>
      </ul>
    </div>
    <div class="buttons">
      <button class="cancel">Cancelar agendamento</button>
      <button class="edit">Editar agendamento</button>
      <button class="new">Agendar um novo atendimento</button>
    </div>
  </main>

  <!-- Rodapé -->
  <footer>
     <p>Feito por:</p>
    <a href="https://github.com/Gusleme"><i class="fa fa-github"></i> Gustavo Leme</a>
    <a href="https://github.com/Isaagapito"><i class="fa fa-github"></i> Isabele Agapito</a>
    <a href="https://github.com/jucastrox"><i class="fa fa-github"></i> Júlia França</a>
    <a href="https://github.com/dias-crypto"><i class="fa fa-github"></i> Natália Dias</a>
    <a href="https://github.com/TuannyThomazelli"><i class="fa fa-github"></i> Tuanny Thomazelli</a>
  </footer>
</body>
</html>
